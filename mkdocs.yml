site_name: Amane
site_description: AI 时代的私人影库
site_url: https://sqzw-x.github.io/amane/
repo_url: https://github.com/sqzw-x/amane
repo_name: sqzw-x/amane
edit_uri: blob/main/docs/
docs_dir: docs

theme:
  name: material
  language: zh
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: 深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: 浅色模式
  features:
    - navigation.tabs
    - navigation.indexes
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.action.edit
    - toc.follow

plugins:
  - search

exclude_docs: |
  roadmap.md
  dev/

nav:
  - 首页: index.md
  - 用户指南:
      - 开始使用: user/index.md
      - 配置指南: user/configuration.md
      - 媒体库管理: user/libraries.md
      - 刮削指南: user/scraping.md
      - 插件: user/plugins.md
      - 常见问题: user/faq.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
