[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "amane"
version = "0.8.0"
description = "Amane — media metadata management service"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiofiles>=25.1.0",
    "aiolimiter>=1.2.1",
    "croniter>=2.0.0",
    "curl-cffi>=0.15.0",
    "openai>=2.36.0",
    "parsel>=1.11.0",
    "pillow>=12.2.0",
    "pydantic-settings>=2.14.1",
    "tomli-w>=1.2.0",
    "sqlmodel>=0.0.38",
    "aiosqlite>=0.22.0",
    "asyncpg>=0.30.0",
    "alembic>=1.18.0",
    "watchdog>=6.0.0",
    "zhconv>=1.4.3",
    "structlog>=25.0.0",
    "fastapi>=0.136.0",
    "uvicorn[standard]>=0.46.0",
    "httpx2>=2.2.0",
    "pydantic-ai-slim[openai,anthropic]>=2.27.0",
    "sqlalchemy[asyncio]>=2.0.51",
    "feedparser>=6.0.14",
    "packaging>=26.3",
    "python-multipart>=0.0.32",
]

[project.optional-dependencies]
browser = [
    "patchright>=1.59.1",
]

[dependency-groups]
dev = [
    "ipykernel>=6.30.1",
    "prek>=0.4.3",
    "pyright>=1.1.400",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=6.2.1",
    "pytest-xdist>=3.8.0",
    "ruff>=0.12.5",
    "ty>=0.0.35",
]
packaging = [
    "pyinstaller>=6.22.0",
]
docs = [
    "mkdocs-material>=9.6.0",
]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/amane"]

[tool.hatch.build.targets.wheel.force-include]
"src/amane/media/watermarks/subtitle.png" = "amane/media/watermarks/subtitle.png"
"src/amane/media/watermarks/uncensored.png" = "amane/media/watermarks/uncensored.png"
"src/amane/media/watermarks/cracked.png" = "amane/media/watermarks/cracked.png"
"src/amane/media/watermarks/leaked.png" = "amane/media/watermarks/leaked.png"
"src/amane/media/watermarks/4k.png" = "amane/media/watermarks/4k.png"
"src/amane/media/watermarks/8k.png" = "amane/media/watermarks/8k.png"

[tool.hatch.build.targets.sdist]
exclude = ["tests/", "docs/", "scripts/", "web/", ".github/"]

[tool.pyright]
include = ["src/amane/", "tests/", "scripts/"]
exclude = [
    "src/amane/db/migrations/",
    "**/node_modules",
    "**/__pycache__",
    "**/.*",
    ".venv",
]
pythonVersion = "3.14"
typeCheckingMode = "basic"
reportMissingImports = "warning"
reportAttributeAccessIssue = "warning"

[tool.ty]
src = { include = ["src/amane/", "scripts/"], exclude = ["src/amane/db/migrations/"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
asyncio_mode = "strict"

[tool.coverage.run]
source = ["amane"]
omit = ["src/amane/db/migrations/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 60
