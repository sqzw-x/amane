name: zz-probe
on:
  push:
    branches: [feat/triage-attachments]
    paths: [.github/workflows/zz-probe.yml, .github/zz_probe.py]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Probe gateway
        env:
          BASE: ${{ secrets.LLM_BASE_URL }}
          KEY: ${{ secrets.CF_GATEWAY_TOKEN }}
          CANDIDATES: deepseek/deepseek-v4.1-flash openai/gpt-4.1-mini openai/gpt-5-mini google/gemini-2.5-flash google/gemini-3-flash qwen/qwen3-vl-plus qwen/qwen2.5-vl-72b-instruct
        run: python3 .github/zz_probe.py
