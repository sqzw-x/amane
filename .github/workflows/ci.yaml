name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "11"

jobs:
  check:
    name: just ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup UV
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Setup just
        uses: extractions/setup-just@v4

      - name: just ci
        env:
          FIXTURES_DEPLOY_KEY: ${{ secrets.FIXTURES_DEPLOY_KEY }}
        run: just ci

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-ubuntu
          path: |
            coverage_html/
            coverage.xml

  windows:
    name: just ci-windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup UV
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Setup just
        uses: extractions/setup-just@v4

      - name: just ci-windows
        run: just ci-windows

  android:
    name: Android shell compile + unit test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # 壳不依赖 web/dist, 也不依赖 Python 依赖: 只要 JDK 与 Android SDK
      - name: just android-check
        run: just android-check
