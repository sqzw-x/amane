name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/docs.yaml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup UV
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          # 本 job 只安装 docs 依赖组, 必须使用独立的缓存 key: 与 CI 共用 key 时, main 上先结束的一方
          # 保存缓存且之后不可覆盖, 只含 docs 依赖的缓存会被 CI 沿用.
          cache-suffix: docs

      - name: Sync docs deps
        run: uv sync --frozen --only-group docs --no-install-project

      - name: Build
        run: uv run --frozen --no-sync mkdocs build --strict

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
