name: Android app

# 只由 `app-` 前缀的 tag 触发, 与本体 (服务端 / 桌面端) 的 `v*` 发版相互独立:
# 本体每次发版会附上同一份 APK, 被误认为 APP 也随版本更新.
on:
  push:
    tags:
      - "app-*"
  workflow_dispatch:

permissions:
  contents: write

env:
  JAVA_VERSION: "21"

jobs:
  android-app:
    name: Build Amane APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup just
        uses: extractions/setup-just@v4

      # tag 与 version.txt 是两个独立的版本来源: 不一致时产物会带着另一个版本号发布, 用户无法覆盖安装,
      # 或装到同名的旧版本.
      - name: Check tag matches version.txt
        if: startsWith(github.ref, 'refs/tags/app-')
        run: |
          EXPECTED="app-$(tr -d '[:space:]' < androidapp/version.txt)"
          if [ "$GITHUB_REF_NAME" != "$EXPECTED" ]; then
            echo "tag $GITHUB_REF_NAME 与 androidapp/version.txt ($EXPECTED) 不一致" >&2
            exit 1
          fi

      - name: Write keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > androidapp/release.jks
          cat > androidapp/keystore.properties <<EOF
          storeFile=release.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      # 没有签名密钥时脚本退回 debug 包 (可侧载, 但不是正式产物).
      - name: just android-app
        run: just android-app

      - name: Collect APK
        id: apk
        run: |
          APK="$(ls -1 dist/Amane-app-*.apk | head -1)"
          test -n "$APK"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          ls -lh "$APK"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: Amane-app-${{ github.ref_name }}
          path: ${{ steps.apk.outputs.apk }}
          if-no-files-found: error

      # 只有 tag 触发的运行才发布; 手动运行 (workflow_dispatch) 到这里就结束, 只留产物.
      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/app-')
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: ${{ steps.apk.outputs.apk }}
          fail_on_unmatched_files: true
