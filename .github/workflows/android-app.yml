name: Android app

# 只由 `app-` 前缀的 tag 触发, 与本体 (服务端 / 桌面端) 的 `v*` 发版相互独立:
# 本体每次发版会附上同一份 APK, 被误认为 APP 也随版本更新.
on:
  push:
    tags:
      - "app-*"
  workflow_dispatch:

permissions:
  contents: write

env:
  JAVA_VERSION: "21"

jobs:
  android-app:
    name: Build Amane APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup just
        uses: extractions/setup-just@v4

      # tag 与 version.txt 是两个独立的版本来源: 不一致时产物会带着另一个版本号发布, 用户无法覆盖安装,
      # 或装到同名的旧版本.
      - name: Check tag matches version.txt
        if: startsWith(github.ref, 'refs/tags/app-')
        run: |
          EXPECTED="app-$(tr -d '[:space:]' < androidapp/version.txt)"
          if [ "$GITHUB_REF_NAME" != "$EXPECTED" ]; then
            echo "tag $GITHUB_REF_NAME 与 androidapp/version.txt ($EXPECTED) 不一致" >&2
            exit 1
          fi

      # 签名密钥只此一份. 缺了它构建会退化成 debug 签名, 而 debug 密钥由构建机在构建时随机生成,
      # 每次产物签名都不同, 已装用户只能卸载重装 — 与其产出这样的 APK, 不如让构建失败.
      - name: Write keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "缺少仓库 secret $name, 无法产出可覆盖安装的 APK" >&2
              exit 1
            fi
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > androidapp/release.jks
          cat > androidapp/keystore.properties <<EOF
          storeFile=release.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: just android-app
        run: just android-app

      - name: Collect APK
        id: apk
        run: |
          APK="$(ls -1 dist/Amane-app-*.apk | head -1)"
          test -n "$APK"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          # upload-artifact 的 name 不允许出现 `/`, 而手动触发多在 fix/... 这类分支上运行.
          echo "artifact=Amane-app-${GITHUB_REF_NAME//\//-}" >> "$GITHUB_OUTPUT"
          ls -lh "$APK"

      # 构建脚本在密钥缺席时会退回 debug 包, 这里再挡一道: 署名不是发版密钥就不上传.
      - name: Check APK signing key
        run: |
          APKSIGNER="$(find "$ANDROID_SDK_ROOT/build-tools" -maxdepth 2 -name apksigner -type f | sort -V | tail -1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --print-certs "${{ steps.apk.outputs.apk }}"
          if "$APKSIGNER" verify --print-certs "${{ steps.apk.outputs.apk }}" | grep -q 'CN=Android Debug'; then
            echo "产物由 debug 密钥签名, 已装用户无法覆盖安装" >&2
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.apk.outputs.artifact }}
          path: ${{ steps.apk.outputs.apk }}
          if-no-files-found: error

      # 只有 tag 触发的运行才发布; 手动运行 (workflow_dispatch) 到这里就结束, 只留产物.
      # `make_latest: false`: Releases 页的 Latest 徽标属于本体版本, 不该被 APP 发布顶掉
      # (本体的更新检查读发布列表并跳过 `app-*`, 与徽标无关).
      # 不用自动生成的 release notes: 它取上一个 Release 作起点, 而那通常是本体的 `v*`, 会把服务端与桌面端的
      # 提交算进 APP 发版; APP 发版频率低, 正文由发版时手工填写.
      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/app-')
        uses: softprops/action-gh-release@v3
        with:
          make_latest: false
          files: ${{ steps.apk.outputs.apk }}
          fail_on_unmatched_files: true
